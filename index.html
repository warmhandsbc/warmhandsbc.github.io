<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Warm Hands 員工打卡</title>
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
  :root{
    --blue:#1565c0; --blue-d:#0d47a1; --blue-l:#e8f0fe;
    --green:#1e9e45; --green-l:#e6f6ea; --red:#d93025; --red-l:#fdecea;
    --amber:#e8a200; --amber-l:#fff6dd; --gray:#5f6b7a; --line:#e3e8ef;
    --bg:#f4f7fb; --card:#fff; --ink:#1b2430;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
  button{font:inherit;cursor:pointer;border:0}
  input,select,textarea{font:inherit;color:inherit}
  .wrap{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:84px}
  .wrap.wide{max-width:1180px}
  header.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px;padding:12px 16px;min-height:56px}
  header.top h1{font-size:18px;margin:0;flex:1;text-align:center;font-weight:600}
  header.top .brand{color:var(--blue);font-weight:700}
  .iconbtn{background:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
  .iconbtn:active{background:var(--blue-l)}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700}
  main{padding:16px}
  .hello{font-size:22px;font-weight:700;margin:4px 0 2px}
  .muted{color:var(--gray)} .small{font-size:13px}
  .sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 10px}
  .sec h2{font-size:17px;margin:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
  .shift{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card)}
  .shift .ico{width:40px;height:40px;border-radius:10px;background:var(--blue-l);color:var(--blue);display:grid;place-items:center;flex:none}
  .shift .name{font-weight:700;font-size:17px}
  .shift .time{margin-top:6px;font-weight:600}
  .chip{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:#eef1f5;color:var(--gray);white-space:nowrap}
  .chip.blue{background:var(--blue-l);color:var(--blue)} .chip.green{background:var(--green-l);color:var(--green)}
  .chip.red{background:var(--red-l);color:var(--red)} .chip.amber{background:var(--amber-l);color:#9a6b00}
  .row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .ri{width:24px;color:var(--gray);flex:none;padding-top:1px}
  .big{font-size:26px;font-weight:700}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border-radius:12px;font-size:18px;font-weight:700;color:#fff;background:var(--blue)}
  .btn.green{background:var(--green)} .btn.red{background:var(--red)}
  .btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue);font-size:16px;padding:13px}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .btn small{display:block;font-size:13px;font-weight:500;opacity:.9}
  .hint{background:#eef2f7;border-radius:12px;padding:14px;text-align:center;color:var(--gray);font-size:14px;line-height:1.6}
  .okbox{background:var(--green-l);border-radius:14px;padding:22px;text-align:center}
  .okbox .tick{width:52px;height:52px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;margin:0 auto 10px}
  .kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
  .kv:last-child{border-bottom:0} .kv b{font-weight:600}
  label.f{display:block;font-weight:600;margin:16px 0 6px}
  .in{width:100%;padding:12px 14px;border:1px solid #cfd6df;border-radius:10px;background:#fff}
  textarea.in{min-height:110px;resize:vertical}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
  nav.tabs .in2{display:flex;width:100%;max-width:520px}
  nav.tabs button{flex:1;background:none;padding:8px 0 10px;color:var(--gray);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
  nav.tabs button.on{color:var(--blue);font-weight:700}
  .day{font-weight:700;margin:18px 2px 8px;color:var(--gray);font-size:14px}
  .empty{text-align:center;color:var(--gray);padding:34px 10px}
  .center{min-height:80vh;display:grid;place-items:center;text-align:center;padding:24px}
  .spin{width:34px;height:34px;border:3px solid var(--blue-l);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1b2430;color:#fff;padding:12px 18px;border-radius:10px;font-size:15px;z-index:50;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.2)}
  .toast.err{background:var(--red)}
  .modal{position:fixed;inset:0;background:rgba(15,23,35,.45);display:grid;place-items:center;z-index:40;padding:20px}
  .modal .box{background:#fff;border-radius:16px;padding:22px;max-width:380px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal .acts{display:flex;gap:10px;margin-top:18px}
  .modal .acts button{flex:1;padding:12px;border-radius:10px;font-weight:700}
  .busy{position:fixed;inset:0;background:rgba(255,255,255,.6);display:grid;place-items:center;z-index:45}
  /* admin */
  .seg{display:flex;gap:6px;background:#e9eef5;padding:4px;border-radius:12px;margin-bottom:14px;overflow-x:auto}
  .seg button{flex:1;padding:9px 12px;border-radius:9px;background:none;font-weight:600;color:var(--gray);white-space:nowrap}
  .seg button.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
  .filters .in{width:auto;padding:9px 10px;font-size:14px}
  .tbl{width:100%;overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
  table{border-collapse:collapse;width:100%;font-size:14px;min-width:760px}
  th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  th{background:#f6f8fb;font-size:12.5px;color:var(--gray);font-weight:600;position:sticky;top:0}
  td.wr{white-space:normal;min-width:180px}
  .mini{padding:6px 12px;border-radius:8px;font-size:13px;font-weight:700}
  .mini.ok{background:var(--blue-l);color:var(--blue)} .mini.no{background:var(--red-l);color:var(--red)}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:96px}
  .stat b{display:block;font-size:20px}
  a{color:var(--blue)}
</style>
</head>
<body>
<div id="app"><div class="center"><div><div class="spin"></div><div class="muted">載入中…</div></div></div></div>
<div id="layer"></div>

<script>
/* ---------------- 狀態 ---------------- */
var S = { me:null, canAdmin:false, canView:false, today:'', tab:'home',
  schedule:null, records:null, extras:null, detail:null, extraFor:null,
  admin:{ sub:'schedule', date:'', from:'', to:'', staffId:'', data:null, extraStatus:'Pending', extraList:null } };
var timer = null;

/* ---------------- 工具 ---------------- */
var IC = {
  home:'<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 11h3v9h6v-6h2v6h6v-9h3z"/></svg>',
  cal:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  rec:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  user:'<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>',
  admin:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
  pin:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  clock:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 5l-7 7 7 7"/></svg>',
  house:'<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 11h3v9h5v-5h4v5h5v-9h3z"/></svg>',
  play:'<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>',
  stop:'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>',
  tick:'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg>',
  refresh:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>'
};
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
/* ================== 設定（只改呢兩行） ================== */
// API project（WarmHands Clock Sheet）部署後嘅 …/exec 網址
var API_URL = '133570870998-sn0e1o2qu98c038kpd36cvuo7lcteoru.apps.googleusercontent.com';
// Google Cloud OAuth Client ID
var CLIENT_ID = '133570870998-sn0e1o2qu98c038kpd36cvuo7lcteoru.apps.googleusercontent.com';
/* ======================================================= */

var TOKEN_KEY = 'wh_clock_token';
function store(k, v){ try{ if(v===null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){} }
function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function tokenExp(t){
  try{ var p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'); while(p.length%4) p+='=';
       return JSON.parse(decodeURIComponent(escape(atob(p)))).exp*1000; }catch(e){ return 0; }
}
function getToken(){ var t=load(TOKEN_KEY); return (t && tokenExp(t) > Date.now()+60000) ? t : null; }

function call(action, payload){
  var tok=getToken();
  if(!tok){ showLogin('登入已過期，請再登入一次'); return Promise.reject(new Error('請重新登入')); }
  return fetch(API_URL, {
    method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},          // 簡單請求，唔使 CORS preflight
    body: JSON.stringify({ idToken: tok, action: action, payload: payload||{} })
  }).then(function(r){ return r.text(); }).then(function(txt){
    var out; try{ out=JSON.parse(txt); }catch(e){ throw new Error('伺服器回應錯誤，請稍後再試'); }
    if(!out.ok){
      if(/^TOKEN_/.test(out.error)){ store(TOKEN_KEY,null); showLogin('登入已過期，請再登入一次'); }
      throw new Error(out.error);
    }
    return out.data;
  }, function(){ throw new Error('網絡連線失敗，請檢查網絡再試'); });
}

/* ---------------- Google 登入 ---------------- */
var gisReady=false;
function initGis(cb){
  if(gisReady) return cb();
  var tries=0;
  (function wait(){
    if(window.google && google.accounts && google.accounts.id){
      google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential, auto_select: true,
        cancel_on_tap_outside: false, use_fedcm_for_prompt: true });
      gisReady=true; cb();
    } else if(++tries < 100) setTimeout(wait, 100);
    else document.getElementById('gbtn').innerHTML='<div class="muted small">載入唔到 Google 登入，請檢查網絡後重新整理。</div>';
  })();
}
function onCredential(resp){
  store(TOKEN_KEY, resp.credential);
  start();
}
function brandHtml(){
  return '<div style="color:var(--blue);margin-bottom:8px"><svg width="56" height="56" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 11h3v9h6v-6h2v6h6v-9h3z"/></svg></div>'+
    '<div style="font-size:26px;font-weight:800;color:var(--blue)">Warm Hands</div><div class="muted small" style="margin-bottom:26px">Home Care Services</div>';
}
function showLogin(note){
  if(timer){ clearInterval(timer); timer=null; }
  document.getElementById('layer').innerHTML='';
  document.getElementById('app').innerHTML='<div class="center"><div style="max-width:340px;width:100%">'+brandHtml()+
    '<div style="font-size:20px;font-weight:700;margin-bottom:6px">員工登入</div>'+
    '<div class="muted small" style="margin-bottom:18px">請使用你登記咗嘅 Google 帳戶（Gmail）登入</div>'+
    (note?'<div class="small" style="color:var(--red);margin-bottom:12px">'+esc(note)+'</div>':'')+
    '<div id="gbtn" style="display:flex;justify-content:center;min-height:44px"></div>'+
    '<div class="muted small" style="margin-top:22px">只允許已登記嘅員工帳戶</div>'+
    '<div class="small" style="margin-top:28px"><a href="privacy.html">Privacy Policy / 私隱政策</a></div></div></div>';
  initGis(function(){
    google.accounts.id.renderButton(document.getElementById('gbtn'),
      { theme:'outline', size:'large', shape:'pill', text:'signin_with', locale:'zh-TW', width:280 });
    google.accounts.id.prompt();
  });
}
function signOut(){
  store(TOKEN_KEY,null);
  S.me=null; S.schedule=null; S.records=null; S.extras=null; S.admin.data=null; S.admin.extraList=null; S.detail=null; S.tab='home';
  if(window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
  showLogin('');
}
var WD = ['日','一','二','三','四','五','六'];
function dParts(k){ var p=k.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function dLong(k){ if(!k) return ''; var d=dParts(k); return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 (星期'+WD[d.getDay()]+')'; }
function dShort(k){ if(!k) return ''; var d=dParts(k); return (d.getMonth()+1)+'月'+d.getDate()+'日 (星期'+WD[d.getDay()]+')'; }
function t12(hm){ if(!hm) return '—'; var p=hm.split(':'), h=+p[0]; return ((h%12)||12)+':'+p[1]+' '+(h<12?'AM':'PM'); }
function hrsText(h){ if(h==null||h==='' ||isNaN(h)) return '—'; var m=Math.round(Number(h)*60); return Math.floor(m/60)+' 小時 '+(m%60)+' 分鐘'; }
function elapsed(ms){ var m=Math.max(0,Math.floor((Date.now()-ms)/60000)); return Math.floor(m/60)+' 小時 '+(m%60)+' 分鐘'; }
function addDaysK(k,n){ var d=dParts(k); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function payChip(s){ return s.payment ? '<span class="chip '+(s.payment.indexOf('⚠️')>=0?'amber':'green')+'">'+esc(s.payment)+'</span>' : '<span class="muted small">—</span>'; }
function noteOf(s){ return s.syncNote ? '<div class="small" style="margin-top:4px;color:'+(s.syncNote.indexOf('⚠️')>=0?'#9a6b00':'var(--gray)')+';white-space:normal;max-width:260px">'+esc(s.syncNote)+'</div>' : ''; }
function chipFor(s){
  var c={upcoming:'',open:'blue',working:'green',done:'green',missed:'red',missedOut:'red',cancelled:'',invalid:'amber'}[s.state]||'';
  if(s.state==='open' && s.label.indexOf('遲到')>=0) c='amber';
  var h='<span class="chip '+c+'">'+esc(s.label)+'</span>';
  if(s.flag) h+=' <span class="chip amber">'+esc(s.flag)+'</span>';
  return h;
}
function toast(msg, err){
  var el=document.createElement('div'); el.className='toast'+(err?' err':''); el.textContent=msg;
  document.body.appendChild(el); setTimeout(function(){ el.remove(); }, err?5000:2600);
}
function busy(on){ document.getElementById('layer').innerHTML = on ? '<div class="busy"><div class="spin"></div></div>' : ''; }
function confirmBox(title, text, okText, okClass){
  return new Promise(function(res){
    var L=document.getElementById('layer');
    L.innerHTML='<div class="modal"><div class="box"><h3>'+esc(title)+'</h3><div class="muted">'+text+'</div>'+
      '<div class="acts"><button id="mNo" style="background:#eef1f5">取消</button><button id="mOk" style="color:#fff;background:var(--'+(okClass||'blue')+')">'+esc(okText||'確定')+'</button></div></div></div>';
    document.getElementById('mNo').onclick=function(){ L.innerHTML=''; res(false); };
    document.getElementById('mOk').onclick=function(){ L.innerHTML=''; res(true); };
  });
}
function getLoc(){
  return new Promise(function(res){
    if(!navigator.geolocation) return res({});
    var done=false; var t=setTimeout(function(){ if(!done){done=true;res({});} }, 8000);
    navigator.geolocation.getCurrentPosition(function(p){ if(done) return; done=true; clearTimeout(t); res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}); },
      function(){ if(done) return; done=true; clearTimeout(t); res({}); }, {enableHighAccuracy:true, timeout:7000, maximumAge:60000});
  });
}
function fail(e){ busy(false); toast((e&&e.message)||String(e), true); }

/* ---------------- 版面 ---------------- */
function page(o){
  if(timer){ clearInterval(timer); timer=null; }
  var tabs=[['home','首頁',IC.home],['schedule','工作安排',IC.cal],['records','紀錄',IC.rec],['profile','個人資料',IC.user]];
  if(S.canView) tabs.push(['admin','管理',IC.admin]);
  var head = o.back
    ? '<header class="top"><button class="iconbtn" onclick="'+o.back+'">'+IC.back+'</button><h1>'+esc(o.title)+'</h1><span style="width:36px"></span></header>'
    : '<header class="top"><button class="iconbtn" onclick="reload()" title="重新整理">'+IC.refresh+'</button><h1 class="brand">Warm Hands</h1><div class="avatar" onclick="go(\'profile\')" style="cursor:pointer">'+esc((S.me.name||'?').trim().charAt(0).toUpperCase())+'</div></header>';
  var nav = o.back ? '' : '<nav class="tabs"><div class="in2">'+tabs.map(function(t){
      return '<button class="'+(S.tab===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[2]+'<span>'+t[1]+'</span></button>'; }).join('')+'</div></nav>';
  document.getElementById('app').innerHTML='<div class="wrap'+(o.wide?' wide':'')+'">'+head+'<main>'+o.body+'</main></div>'+nav;
  window.scrollTo(0,0);
}
function loading(title){ page({title:title||'', body:'<div class="center" style="min-height:50vh"><div><div class="spin"></div><div class="muted">載入中…</div></div></div>'}); }

function go(tab){ S.tab=tab; S.detail=null; render(); }
function reload(){ S.schedule=null; S.records=null; S.extras=null; S.admin.data=null; S.admin.extraList=null; render(); }

function render(){
  if(S.detail) return renderDetail();
  if(S.tab==='home') return renderHome();
  if(S.tab==='schedule') return renderSchedule();
  if(S.tab==='records') return renderRecords();
  if(S.tab==='profile') return renderProfile();
  if(S.tab==='admin') return renderAdmin();
}

function shiftCard(s, showDate){
  return '<button class="card shift" onclick="openShift(\''+esc(s.id)+'\')">'+
    '<div class="ico">'+IC.house+'</div><div style="flex:1;min-width:0">'+
    '<div class="name">'+esc(s.client)+'</div>'+
    '<div class="muted small">'+esc(s.address)+'</div>'+
    (showDate?'<div class="muted small" style="margin-top:4px">'+dShort(s.date)+'</div>':'')+
    '<div class="time">'+t12(s.start)+' – '+t12(s.end)+'</div>'+
    '<div style="margin-top:8px">'+chipFor(s)+'</div></div></button>';
}

/* ---------------- 首頁 ---------------- */
function loadSchedule(){ return call('myShifts',{view:'schedule'}).then(function(d){ S.schedule=d; S.today=d.today; return d; }); }
function renderHome(){
  if(!S.schedule){ loading(); return loadSchedule().then(renderHome).catch(fail); }
  var list=S.schedule.shifts.filter(function(s){ return s.date===S.today || s.state==='working'; });
  var body='<div class="hello">你好，'+esc(S.me.name)+'</div><div class="muted">'+dLong(S.today)+'</div>'+
    '<div class="sec"><h2>今日工作安排</h2><span class="muted small">共 '+list.length+' 個</span></div>'+
    (list.length? list.map(function(s){return shiftCard(s,false);}).join('') : '<div class="card empty">今日冇排更 🎉</div>');
  var next=S.schedule.shifts.filter(function(s){ return s.date>S.today; })[0];
  if(next) body+='<div class="sec"><h2>下一更</h2></div>'+shiftCard(next,true);
  page({body:body});
}

/* ---------------- 工作安排 ---------------- */
function renderSchedule(){
  if(!S.schedule){ loading(); return loadSchedule().then(renderSchedule).catch(fail); }
  var by={}, keys=[];
  S.schedule.shifts.forEach(function(s){ if(!by[s.date]){by[s.date]=[];keys.push(s.date);} by[s.date].push(s); });
  var body='<div class="sec" style="margin-top:4px"><h2>未來工作安排</h2><span class="muted small">共 '+S.schedule.shifts.length+' 更</span></div>';
  body+= keys.length ? keys.map(function(k){ return '<div class="day">'+(k===S.today?'今日・':'')+dShort(k)+'</div>'+by[k].map(function(s){return shiftCard(s,false);}).join(''); }).join('')
    : '<div class="card empty">暫時冇排更</div>';
  page({body:body});
}

/* ---------------- 紀錄 ---------------- */
function renderRecords(){

    return '<button class="card shift" onclick="openShift(\''+esc(s.id)+'\',\'records\')"><div style="flex:1">'+

      '<div class="muted small" style="margin-top:4px">'+dShort(s.date)+'｜預定 '+t12(s.start)+' – '+t12(s.end)+'</div>'+
      '<div class="small" style="margin-top:6px">實際 '+(s.clockIn?t12(s.clockIn):'—')+' – '+(s.clockOut?t12(s.clockOut):'—')+
      (s.actualHrs?'｜<b>'+s.actualHrs+' 小時</b>':'')+(s.extraMin?'｜額外 '+s.extraMin+' 分鐘':'')+'</div></div></button>';
  }).join('') : '<div class="card empty">過去 31 日冇紀錄</div>';
  page({body:body});
}

/* ---------------- 個人資料 ---------------- */
function renderProfile(){

/* ---------------- 工作詳情 / 打卡 ---------------- */
function findShift(id){
  var pools=[S.schedule&&S.schedule.shifts, S.records&&S.records.shifts];
  for(var i=0;i<pools.length;i++) if(pools[i]) for(var j=0;j<pools[i].length;j++) if(pools[i][j].id===id) return pools[i][j];
  return null;
}
function openShift(id){ S.detail=id; renderDetail(); }
function closeDetail(){ S.detail=null; render(); }
function replaceShift(v){
  [S.schedule&&S.schedule.shifts, S.records&&S.records.shifts].forEach(function(l){
    if(l) for(var j=0;j<l.length;j++) if(l[j].id===v.id){ var ex=l[j].extras; l[j]=v; v.extras=ex; } });
}

function renderDetail(){
  var s=findShift(S.detail); if(!s){ S.detail=null; return render(); }
  var title={working:'工作進行中',done:'完成工作'}[s.state]||'工作詳情';
  var map='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.address||'');
  var body='<div class="card"><div class="row"><div class="ri">'+IC.pin+'</div><div><div class="name" style="font-weight:700;font-size:18px">'+esc(s.client)+'</div>'+
    (s.address?'<a class="small" href="'+map+'" target="_blank" rel="noopener">'+esc(s.address)+'</a>':'')+'</div></div>';

  if(s.state==='working'){
    body+='<div class="row" style="background:var(--green-l);margin:8px -16px;padding:14px 16px"><div class="ri" style="color:var(--green)">'+IC.clock+'</div><div><div class="muted small">開始時間</div><div class="big">'+t12(s.clockIn)+'</div><div class="muted small">(已打卡)</div></div></div>'+
      '<div class="row"><div class="ri">'+IC.cal+'</div><div><div class="muted small">預定結束時間</div><div style="font-size:18px;font-weight:600">'+t12(s.end)+'</div></div></div>'+
      '<div class="row"><div class="ri">'+IC.clock+'</div><div><div class="muted small">已工作時間</div><div style="font-size:18px;font-weight:600" id="elapsed">'+elapsed(s.clockInMs)+'</div></div></div></div>';
  } else if(s.state==='done'){
    body+='</div><div class="okbox"><div class="tick">'+IC.tick+'</div><div style="font-size:18px;font-weight:700">已完成打卡</div><div class="muted">結束時間：'+t12(s.clockOut)+'</div>'+
      (s.flag?'<div style="margin-top:8px"><span class="chip amber">'+esc(s.flag)+'</span></div>':'')+'</div>'+
      '<div class="card" style="margin-top:12px"><div class="kv"><span class="muted">日期</span><b>'+dShort(s.date)+'</b></div>'+
      '<div class="kv"><span class="muted">預定時間</span><b>'+t12(s.start)+' – '+t12(s.end)+'</b></div>'+
      '<div class="kv"><span class="muted">實際時間</span><b>'+t12(s.clockIn)+' – '+t12(s.clockOut)+'</b></div>'+
      '<div class="kv"><span class="muted">總工作時數</span><b>'+hrsText(s.actualHrs)+'</b></div>'+
      (s.extraMin?'<div class="kv"><span class="muted">已批額外時間</span><b>'+s.extraMin+' 分鐘</b></div>':'')+'</div>';
  } else {
    body+='<div class="row"><div class="ri">'+IC.cal+'</div><div style="font-weight:600">'+dLong(s.date)+'</div></div>'+
      '<div class="row"><div class="ri">'+IC.clock+'</div><div style="font-weight:600">'+t12(s.start)+' – '+t12(s.end)+'</div></div>'+
      '<div class="row"><div class="ri"></div><div>'+chipFor(s)+'</div></div></div>';
  }

  if(s.canClockIn){
    body+='<button class="btn green" onclick="doClockIn()">'+IC.play+'<span>Clock In<small>開始工作</small></span></button>'+
      '<div class="hint" style="margin-top:12px">請在到達客戶住所後按打卡<br>系統會自動記錄時間</div>';
  } else if(s.state==='upcoming'){
    body+='<button class="btn green" disabled>'+IC.play+'<span>Clock In<small>開始工作</small></span></button>'+
      '<div class="hint" style="margin-top:12px">'+(s.date===S.today?'今日 '+t12(s.earliestClockIn)+' 起可以打卡':'只可以喺 '+dShort(s.date)+' 當日打卡')+'</div>';
  } else if(s.state==='missed'){
    body+='<div class="hint">呢更冇開工打卡紀錄，如有出勤請聯絡 Coordinator 補登</div>';
  } else if(s.state==='missedOut'){
    body+='<div class="hint">已過收工打卡時限，請聯絡 Coordinator 補登收工時間</div>';
  }
  if(s.canClockOut){
    body+='<div style="height:4px"></div><button class="btn red" onclick="doClockOut()">'+IC.stop+'<span>Clock Out<small>結束工作</small></span></button>';
  }
  if(s.canExtra){
    body+='<div style="height:12px"></div><button class="btn ghost" onclick="openExtra()">'+IC.plus+' 申請額外時間</button>';
  }
  if(s.extras && s.extras.length){
    var stMap={Pending:['待審批','amber'],Approved:['已批准','green'],Rejected:['已拒絕','red']};
    body+='<div class="sec"><h2>額外時間申請</h2></div>'+s.extras.map(function(e){ var st=stMap[e.status]||[e.status,''];
      return '<div class="card"><div style="display:flex;justify-content:space-between"><b>'+e.minutes+' 分鐘</b><span class="chip '+st[1]+'">'+st[0]+'</span></div><div class="small muted" style="margin-top:4px">'+esc(e.reason)+'</div></div>'; }).join('');
  }
  if(s.state==='done'){ body+='<div style="height:12px"></div><button class="btn" onclick="S.tab=\'home\';closeDetail()">返回首頁</button>'; }
  page({title:title, back:'closeDetail()', body:body});
  if(s.state==='working'){ timer=setInterval(function(){ var el=document.getElementById('elapsed'); if(el) el.textContent=elapsed(s.clockInMs); }, 30000); }
}

function doClockIn(){
  var s=findShift(S.detail);
  confirmBox('開始工作？', esc(s.client)+'<br>預定 '+t12(s.start)+' – '+t12(s.end), 'Clock In', 'green').then(function(ok){
    if(!ok) return; busy(true);
    getLoc().then(function(loc){ loc.shiftId=s.id; return call('clockIn', loc); })
      .then(function(v){ busy(false); replaceShift(v); toast('已打卡 '+t12(v.clockIn)); renderDetail(); }).catch(fail);
  });
}
function doClockOut(){
  var s=findShift(S.detail);
  var now=new Date(), early = s.endMs && now.getTime() < s.endMs - 10*60000;
  confirmBox('結束工作？', early?'<b style="color:var(--red)">未到預定收工時間（'+t12(s.end)+'）</b><br>確定要提早收工？':'已工作 '+elapsed(s.clockInMs), 'Clock Out', 'red').then(function(ok){
    if(!ok) return; busy(true);
    getLoc().then(function(loc){ loc.shiftId=s.id; return call('clockOut', loc); })
      .then(function(v){ busy(false); replaceShift(v); toast('已收工打卡 '+t12(v.clockOut)); S.records=null; renderDetail(); }).catch(fail);
  });
}

/* ---------------- 申請額外時間 ---------------- */
function openExtra(){
  var s=findShift(S.detail);
  var opts=[15,30,45,60,90,120,180].map(function(m){ return '<option value="'+m+'">'+(m<60?m+' 分鐘':(m/60)+' 小時')+'</option>'; }).join('');
  var body='<label class="f" style="margin-top:0">客戶</label><div class="in" style="background:#f6f8fb">'+esc(s.client)+'（'+dShort(s.date)+'）</div>'+
    '<label class="f">額外時間</label><select id="exMin" class="in">'+opts+'</select>'+
    '<label class="f">原因</label><textarea id="exReason" class="in" placeholder="例如：客戶需要額外協助準備餐膳"></textarea>'+
    '<div style="height:18px"></div><button class="btn" onclick="submitExtra()">提交申請</button>'+
    '<div class="hint" style="margin-top:12px">提交後由管理員審批，批准後會計入呢更嘅時數</div>';
  page({title:'申請額外工作時間', back:'renderDetail()', body:body});
}
function submitExtra(){
  var s=findShift(S.detail);
  var min=+document.getElementById('exMin').value, reason=document.getElementById('exReason').value.trim();
  if(!reason){ toast('請填寫原因', true); return; }
  busy(true);
  call('requestExtra',{shiftId:s.id, minutes:min, reason:reason}).then(function(r){
    busy(false); s.extras=(s.extras||[]).concat([{id:r.requestId,minutes:min,status:'Pending',reason:reason}]);
    S.extras=null; toast('已提交，等待審批'); renderDetail();
  }).catch(fail);
}

/* ---------------- 管理員 ---------------- */
function renderAdmin(){
  var A=S.admin;
  if(!A.date){ A.date=S.today; A.from=addDaysK(S.today,-6); A.to=S.today; A.sFrom=S.today; A.sTo=addDaysK(S.today,6); }
  var seg='<div class="seg">'+[['schedule','員工更表'],['records','打卡紀錄'],['extra','額外時間審批']].map(function(x){
    return '<button class="'+(A.sub===x[0]?'on':'')+'" onclick="S.admin.sub=\''+x[0]+'\';S.admin.data=null;renderAdmin()">'+x[1]+'</button>'; }).join('')+'</div>';
  if(A.sub==='extra') return renderAdminExtra(seg);
  var isRec = A.sub==='records';
  var q = isRec ? {from:A.from,to:A.to,staffId:A.staffId} : {from:A.sFrom,to:A.sTo,staffId:A.staffId};
  if(!A.data){ page({wide:true, body:seg+'<div class="center" style="min-height:40vh"><div class="spin"></div></div>'});
    return call('adminShifts',q).then(function(d){ A.data=d; renderAdmin(); }).catch(fail); }
  var d=A.data;
  var staffOpts='<option value="">所有員工</option>'+(d.staff||[]).map(function(x){ return '<option value="'+esc(x.staffId)+'"'+(x.staffId===A.staffId?' selected':'')+'>'+esc(x.name||x.staffId)+'</option>'; }).join('');
  var filters='<div class="filters">'+(isRec
      ? '<input type="date" class="in" value="'+A.from+'" onchange="S.admin.from=this.value;S.admin.data=null;renderAdmin()"> 至 <input type="date" class="in" value="'+A.to+'" onchange="S.admin.to=this.value;S.admin.data=null;renderAdmin()">'
      : '<input type="date" class="in" value="'+A.sFrom+'" onchange="setSRange(this.value,S.admin.sTo)"> 至 <input type="date" class="in" value="'+A.sTo+'" onchange="setSRange(S.admin.sFrom,this.value)">'+
        '<button class="mini ok" onclick="setSRange(S.today,S.today)">今日</button>'+
        '<button class="mini ok" onclick="setSRange(S.today,addDaysK(S.today,6))">7 日</button>'+
        '<button class="mini ok" onclick="setSRange(S.today,addDaysK(S.today,30))">30 日</button>')+
    '<select class="in" onchange="S.admin.staffId=this.value;S.admin.data=null;renderAdmin()">'+staffOpts+'</select>'+
    '<button class="mini ok" onclick="S.admin.data=null;renderAdmin()">重新整理</button>'+
    '<button class="mini ok" style="background:var(--blue);color:#fff" onclick="syncNow()">⟳ 立即同步日曆</button>'+
    (d.lastSync?'<span class="muted small">上次同步：'+agoText(d.lastSync.at)+'</span>':'')+'</div>';
  var l=d.shifts, cnt={done:0,working:0,missed:0,pending:0}, hrs=0;
  l.forEach(function(s){ if(s.state==='done')cnt.done++; else if(s.state==='working')cnt.working++; else if(s.state==='missed'||s.state==='missedOut')cnt.missed++; else if(s.state!=='cancelled')cnt.pending++; if(s.actualHrs) hrs+=Number(s.actualHrs); });
  var stats='<div class="stats"><div class="stat"><span class="muted small">總更數</span><b>'+l.length+'</b></div><div class="stat"><span class="muted small">已完成</span><b style="color:var(--green)">'+cnt.done+'</b></div>'+
    '<div class="stat"><span class="muted small">工作中</span><b style="color:var(--blue)">'+cnt.working+'</b></div><div class="stat"><span class="muted small">漏打卡</span><b style="color:var(--red)">'+cnt.missed+'</b></div>'+
    (isRec?'<div class="stat"><span class="muted small">實際工時</span><b>'+(Math.round(hrs*100)/100)+'</b></div>':'<div class="stat"><span class="muted small">未開始</span><b>'+cnt.pending+'</b></div>')+'</div>';
  var rows = l.length ? l.map(function(s){
    return isRec
      ? '<tr><td>'+esc(s.date)+'</td><td>'+esc(s.worker)+'</td><td>'+esc(s.client)+'</td><td>'+t12(s.start)+' – '+t12(s.end)+'</td><td>'+(s.clockIn?t12(s.clockIn):'—')+'</td><td>'+(s.clockOut?t12(s.clockOut):'—')+'</td><td>'+(s.actualHrs!=null?s.actualHrs:'—')+'</td><td>'+(s.extraMin||'')+'</td><td>'+chipFor(s)+noteOf(s)+'</td><td>'+payChip(s)+'</td></tr>'
      : '<tr><td>'+esc(dShort(s.date))+'</td><td>'+esc(s.worker)+'</td><td>'+esc(s.client)+'</td><td class="wr">'+esc(s.address)+'</td><td>'+t12(s.start)+'</td><td>'+t12(s.end)+'</td><td>'+(s.clockIn?t12(s.clockIn):'—')+'</td><td>'+(s.clockOut?t12(s.clockOut):'—')+'</td><td>'+chipFor(s)+noteOf(s)+'</td><td>'+payChip(s)+'</td></tr>';
  }).join('') : '<tr><td colspan="10" class="empty">冇資料</td></tr>';
  var head = isRec ? '<th>日期</th><th>員工</th><th>客戶</th><th>預定</th><th>開工</th><th>收工</th><th>時數</th><th>額外(分)</th><th>狀態</th><th>付款</th>'
                   : '<th>日期</th><th>員工</th><th>客戶</th><th>地址</th><th>開始</th><th>結束</th><th>開工打卡</th><th>收工打卡</th><th>狀態</th><th>付款</th>';
  page({wide:true, body:seg+filters+stats+'<div class="tbl"><table><thead><tr>'+head+'</tr></thead><tbody>'+rows+'</tbody></table></div>'});
}

/** 員工更表日期範圍（API 最多 62 日） */
function setSRange(f,t){
  if(!f||!t) return;
  if(t<f){ var x=f; f=t; t=x; }
  if(addDaysK(f,61) < t){ t=addDaysK(f,61); toast('日期範圍最多 62 日，已調整做 '+t); }
  S.admin.sFrom=f; S.admin.sTo=t; S.admin.data=null; renderAdmin();
}

function renderAdminExtra(seg){
  var A=S.admin;
  var sub='<div class="filters"><button class="mini '+(A.extraStatus==='Pending'?'ok':'')+'" onclick="S.admin.extraStatus=\'Pending\';S.admin.extraList=null;renderAdmin()">待審批</button>'+
    '<button class="mini '+(A.extraStatus==='Done'?'ok':'')+'" onclick="S.admin.extraStatus=\'Done\';S.admin.extraList=null;renderAdmin()">已審批（60 日內）</button></div>';
  if(!A.extraList){ page({wide:true, body:seg+sub+'<div class="center" style="min-height:40vh"><div class="spin"></div></div>'});
    return call('adminExtra',{status:A.extraStatus}).then(function(d){ A.extraList=d; renderAdmin(); }).catch(fail); }
  var stMap={Pending:['待審批','amber'],Approved:['已批准','green'],Rejected:['已拒絕','red']};
  var rows = A.extraList.length ? A.extraList.map(function(e){ var st=stMap[e.status]||[e.status,''];
    var act = e.status==='Pending' ? (S.canAdmin ? '<button class="mini ok" onclick="review(\''+esc(e.id)+'\',\'Approved\')">批准</button> <button class="mini no" onclick="review(\''+esc(e.id)+'\',\'Rejected\')">拒絕</button>' : '<span class="muted small">只可檢視</span>')
      : '<span class="muted small">'+esc(e.reviewedBy)+'</span>';
    return '<tr><td>'+esc(e.date)+'</td><td>'+esc(e.worker)+'</td><td>'+esc(e.client)+'</td><td>'+e.minutes+' 分鐘</td><td class="wr">'+esc(e.reason)+'</td><td><span class="chip '+st[1]+'">'+st[0]+'</span></td><td>'+act+'</td></tr>';
  }).join('') : '<tr><td colspan="7" class="empty">冇申請</td></tr>';
  page({wide:true, body:seg+sub+'<div class="tbl"><table><thead><tr><th>日期</th><th>員工</th><th>客戶</th><th>額外時間</th><th>原因</th><th>狀態</th><th>操作</th></tr></thead><tbody>'+rows+'</tbody></table></div>'});
}

function agoText(ms){
  var m=Math.max(0,Math.round((Date.now()-ms)/60000)), t=new Date(ms);
  var hm=t.getHours()+':'+String(t.getMinutes()).padStart(2,'0');
  return hm+'（'+(m<1?'啱啱':m+' 分鐘前')+'）';
}
function syncNow(){
  busy(true);
  call('syncNow',{}).then(function(r){
    busy(false);
    toast(r.skipped ? '1 分鐘內啱啱同步過，已顯示最新資料' : '已同步日曆');
    S.admin.data=null; S.schedule=null; S.records=null; renderAdmin();
  }).catch(fail);
}
function review(id, decision){
  var e=S.admin.extraList.filter(function(x){return x.id===id;})[0];
  var title = decision==='Approved'?'批准額外時間？':'拒絕額外時間？';
  confirmBox(title, esc(e.worker)+'｜'+esc(e.client)+'｜'+e.minutes+' 分鐘<br>'+esc(e.reason), decision==='Approved'?'批准':'拒絕', decision==='Approved'?'blue':'red').then(function(ok){
    if(!ok) return; busy(true);
    call('reviewExtra',{requestId:id, decision:decision}).then(function(){ busy(false); toast(decision==='Approved'?'已批准':'已拒絕'); S.admin.extraList=null; renderAdmin(); }).catch(fail);
  });
}

/* ---------------- 開始 ---------------- */
function start(){
  if(API_URL.indexOf('PASTE_')===0){ document.getElementById('app').innerHTML='<div class="center"><div class="card">未設定 API_URL：請喺 index.html 頂部填入 API 網址</div></div>'; return; }
  if(!getToken()){ showLogin(''); return; }
  document.getElementById('app').innerHTML='<div class="center"><div><div class="spin"></div><div class="muted">載入中…</div></div></div>';
  call('me',{}).then(function(d){
    S.me=d.me; S.today=d.today; S.canAdmin=d.canAdmin; S.canView=d.canView;
    render();
  }).catch(function(e){
    var msg=(e&&e.message)||String(e), m=msg.match(/NOT_REGISTERED:(.*)$/);
    if(/^TOKEN_|請重新登入/.test(msg)) return;                // 已顯示登入畫面
    document.getElementById('app').innerHTML='<div class="center"><div style="max-width:340px">'+
      '<div style="color:var(--blue);margin-bottom:8px"><svg width="56" height="56" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 11h3v9h6v-6h2v6h6v-9h3z"/></svg></div>'+
      '<div style="font-size:24px;font-weight:800;color:var(--blue)">Warm Hands</div><div class="muted small" style="margin-bottom:22px">Home Care Services</div>'+
      (m ? '<div class="card"><b>帳戶未登記</b><div class="muted small" style="margin-top:8px;line-height:1.6">你而家用緊 <b>'+esc(m[1])+'</b> 登入。<br>只允許已登記嘅員工帳戶，請聯絡公司加入，或者轉用已登記嘅 Gmail。</div></div>'+
           '<button class="btn" style="margin-top:12px" onclick="signOut()">用其他帳戶登入</button>'
         : '<div class="card"><b>載入失敗</b><div class="muted small" style="margin-top:8px">'+esc(msg)+'</div></div>'+
           '<button class="btn" style="margin-top:12px" onclick="start()">再試一次</button>')+'</div></div>';
  });
}
start();
</script>
</body>
</html>
